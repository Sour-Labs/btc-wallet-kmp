name: Tests

on:
  pull_request:
    branches: [ main ]
  # Also run on main itself so post-merge breakage shows up as a red
  # commit status rather than silently lurking until the next PR.
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM & Android Host Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run JVM tests
        run: ./gradlew jvmTest

      - name: Run Android host tests
        run: ./gradlew testAndroidHostTest

  ios-tests:
    name: iOS Simulator Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test

  linux-tests:
    name: Linux Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Retry once with a clean state. Gradle's TestOutputStore intermittently
      # throws "Multiple entries with same key: NNN" when aggregating
      # Kotlin/Native test results on Linux — the test binary runs and reports
      # correctly, but result-aggregation fails before the build can finish.
      # A clean re-run almost always succeeds. Two attempts × ~90 s is cheap
      # insurance versus blocking PRs on infrastructure flake.
      - name: Run Linux x64 tests
        run: |
          set +e
          ./gradlew linuxX64Test
          status=$?
          if [ $status -ne 0 ]; then
            echo "::warning::First linuxX64Test attempt failed (suspected Gradle/Kotlin-Native TestOutputStore index collision). Retrying with clean state..."
            ./gradlew clean linuxX64Test
            status=$?
          fi
          exit $status
