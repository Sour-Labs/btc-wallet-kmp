name: Tests

on:
  pull_request:
    branches: [ main ]
  # Also run on main itself so post-merge breakage shows up as a red
  # commit status rather than silently lurking until the next PR.
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM & Android Host Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run JVM tests
        run: ./gradlew jvmTest

      - name: Run Android host tests
        run: ./gradlew testAndroidHostTest

  ios-tests:
    name: iOS Simulator Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test

  linux-tests:
    name: Linux Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Compile and link the Linux x64 test binary without executing it.
      #
      # Gradle's Kotlin/Native test result aggregator reliably fails on Linux
      # for this project's test suite with one of:
      #   "Multiple entries with same key: NNN" (TestOutputStore$Index)
      #   "Could not write XML test results for io.sourlabs...RetryTest"
      # Tests that throw and catch exceptions through coroutine boundaries
      # (RetryTest, the scanner failure tests) seem to trigger it. No retry/
      # clean strategy made the issue go away.
      #
      # iOS simulator runs the same Kotlin/Native runtime against the same
      # commonTest sources on every CI run and passes consistently, so the
      # Kotlin/Native code path is exercised. This step keeps Linux as a
      # smoke test that the target still compiles and links — enough to
      # catch real Native-only build breakage. Revisit running the binary
      # once the Gradle aggregator bug is addressed upstream.
      - name: Compile and link Linux x64 tests
        run: ./gradlew compileTestKotlinLinuxX64 linkDebugTestLinuxX64
